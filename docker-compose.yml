services:
  postgres:
    image: postgres:16
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hotel_data:/var/lib/postgresql/data
volumes:
  hotel_data:
